services:
  - type: web
    name: internship-seminar-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: DEFAULT_SEMINAR_FEE
        value: "150.00"
      - key: ENTRANCE_PIN
        value: "1111"
      - key: FINANCE_PIN
        value: "2222"
      - key: ADMIN_PIN
        value: "9999"